name: Build apps

# Run it from the "Actions" tab (tick the platforms you want), or push a tag
# like v1.0.1 to build every platform and publish the files in a Release.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: Windows (.exe / .msi)
        type: boolean
        default: true
      linux:
        description: Linux (.AppImage / .deb / .rpm)
        type: boolean
        default: true
      android:
        description: Android (.apk)
        type: boolean
        default: true
      macos:
        description: macOS Apple Silicon (.dmg)
        type: boolean
        default: true
      release:
        description: Publish a release with this tag (ex. v1.0.0), empty = no release
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - id: plan
        env:
          ALL: ${{ github.event_name != 'workflow_dispatch' }}
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
          MACOS: ${{ inputs.macos }}
          ANDROID: ${{ inputs.android }}
        run: |
          items=()
          if [ "$ALL" = true ] || [ "$LINUX" = true ]; then items+=('{"name":"Linux","os":"ubuntu-22.04","args":""}'); fi
          if [ "$ALL" = true ] || [ "$WINDOWS" = true ]; then items+=('{"name":"Windows","os":"windows-latest","args":""}'); fi
          if [ "$ALL" = true ] || [ "$MACOS" = true ]; then items+=('{"name":"macOS","os":"macos-latest","args":"--target aarch64-apple-darwin"}'); fi
          joined=$(IFS=,; echo "${items[*]}")
          echo "desktop={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          if [ "$ALL" = true ] || [ "$ANDROID" = true ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.desktop != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: card-studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # SDK and NDK are preinstalled on the ubuntu runners (ANDROID_HOME,
      # ANDROID_NDK_LATEST_HOME); Tauri expects NDK_HOME.
      - name: Android NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # arm64 only: the card images are embedded in the native library, so each
      # extra architecture would add ~280 MB to the APK. Every phone sold since
      # ~2017 is arm64.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The signing key lives in repository secrets (Settings > Secrets and variables > Actions):
      #   ANDROID_KEYSTORE_BASE64   = base64 of card-studio.jks
      #   ANDROID_KEYSTORE_PASSWORD = its password (alias: card-studio)
      # Without them a throw-away key is used: that APK installs, but cannot
      # update a version signed with another key (uninstalling erases the gallery).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: src-tauri/gen/android
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > card-studio.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets not set: signing with a temporary key."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore card-studio.jks -alias card-studio -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Card Studio"
          fi
          printf "storeFile=card-studio.jks\nstorePassword=%s\nkeyAlias=card-studio\nkeyPassword=%s\n" "$PASS" "$PASS" > signing.properties

      - name: Build APK
        run: npx tauri android build --apk --target aarch64

      - name: Collect APK
        run: |
          mkdir -p dist
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          for f in dist/*.apk; do mv "$f" "dist/Card-Studio-${GITHUB_REF_NAME//\//-}-arm64.apk"; break; done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: card-studio-Android
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  # One job publishes the release once every build is done (parallel jobs
  # creating the same release can race).
  release:
    name: Publish release
    needs: [desktop, android]
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.release != '') && !cancelled() && needs.desktop.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
          target_commitish: ${{ github.sha }}
          name: Card Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
          files: dist/*
          body: |
            Éditeur de cartes hors ligne. Télécharge le fichier de ton système :

            **Windows** : `…_x64-setup.exe` (ou le `.msi`). Si SmartScreen s'affiche : « Informations complémentaires » → « Exécuter quand même ».

            **macOS (Apple Silicon)** : `…_aarch64.dmg`. App non signée : la première fois, clic droit → Ouvrir.

            **Linux** :
            - Debian / Ubuntu / Mint : le `.deb` (`sudo apt install ./fichier.deb`)
            - Fedora / openSUSE : le `.rpm` (`sudo dnf install ./fichier.rpm`)
            - Autres distributions : l'`.AppImage` (`chmod +x`, puis la lancer)

            **Android** : `Card-Studio-…-arm64.apk`. Autorise l'installation d'applis inconnues. Pour mettre à jour, installe par-dessus l'ancienne version, sans la désinstaller (sinon la galerie est effacée).
