[package]
name = "card-studio"
version = "1.0.0"
description = "Offline custom card creator"
edition = "2021"
publish = false

[lib]
name = "card_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "compression" is left out on purpose: the ~300 MB of WebP/WOFF2 assets do not
# compress further and brotli would only slow builds down.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
